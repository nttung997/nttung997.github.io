<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0a0d12">
    <title>Parallel Parking — Practice</title>
    <style>
        :root {
            --ink: #e8eef7;
            --muted: #8d9aad;
            --bg: #0a0d12;
            --panel: rgba(13, 18, 25, .78);
            --line: rgba(255, 255, 255, .10);
            --accent: #5fb8ff;
            --good: #5ee08a;
            --bad: #ff6060;
            --safe-b: env(safe-area-inset-bottom, 0px);
            --safe-t: env(safe-area-inset-top, 0px);
            --ctor: 0px;
        }

        * {
            box-sizing: border-box
        }

        html,
        body {
            height: 100%;
            margin: 0;
            overflow: hidden;
            overscroll-behavior: none;
        }

        body {
            background: var(--bg);
            color: var(--ink);
            font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
        }

        #stage {
            position: fixed;
            inset: 0;
            bottom: calc(var(--ctor) + var(--safe-b));
        }

        #game {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .hud {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 5;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            height: 100%;
            padding: calc(16px + var(--safe-t)) 18px 16px;
            gap: 12px;
        }

        .row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            flex-wrap: wrap;
        }

        .row.bottom {
            align-items: flex-end;
            margin-top: auto;
        }

        .brand {
            font-size: 15px;
            font-weight: 650;
            letter-spacing: .2px;
            white-space: nowrap;
        }

        .brand small {
            display: block;
            font-weight: 400;
            font-size: 12px;
            color: var(--muted);
            letter-spacing: 0;
            white-space: normal;
        }

        .levels {
            display: flex;
            gap: 6px;
            pointer-events: auto;
            padding: 5px;
            border-radius: 12px;
            background: var(--panel);
            border: 1px solid var(--line);
            backdrop-filter: blur(10px);
        }

        .stats {
            display: flex;
            gap: 8px;
            pointer-events: auto;
        }

        .stat {
            display: flex;
            align-items: baseline;
            gap: 8px;
            padding: 7px 12px;
            border-radius: 10px;
            background: var(--panel);
            border: 1px solid var(--line);
            backdrop-filter: blur(10px);
        }

        .stat span {
            font-size: 10px;
            letter-spacing: .14em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .stat b {
            font-size: 14px;
            font-variant-numeric: tabular-nums;
            min-width: 2ch;
            text-align: right;
        }

        #gear[data-gear="R"] {
            color: #ffcf5e
        }

        #gear[data-gear="D"] {
            color: var(--good)
        }

        .levels button {
            appearance: none;
            border: 0;
            background: transparent;
            color: var(--muted);
            font: inherit;
            font-size: 12.5px;
            padding: 6px 13px;
            border-radius: 8px;
            cursor: pointer;
            transition: background .15s, color .15s;
        }

        .levels button:hover {
            color: var(--ink);
            background: rgba(255, 255, 255, .06)
        }

        .levels button[aria-pressed="true"] {
            background: rgba(95, 184, 255, .16);
            color: var(--accent);
        }

        .hint {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            font-size: 12px;
            color: var(--muted);
            padding: 7px 12px;
            border-radius: 10px;
            background: var(--panel);
            border: 1px solid var(--line);
            backdrop-filter: blur(10px);
        }

        kbd {
            font: inherit;
            font-size: 11px;
            padding: 1px 6px;
            border-radius: 5px;
            background: rgba(255, 255, 255, .08);
            border: 1px solid var(--line);
            color: var(--ink);
        }

        .hint .dot {
            opacity: .35;
            margin: 0 2px
        }

        .back {
            font-size: 12.5px;
            color: var(--muted);
            text-decoration: none;
            padding: 7px 12px;
            border-radius: 10px;
            background: var(--panel);
            border: 1px solid var(--line);
            backdrop-filter: blur(10px);
            pointer-events: auto;
            transition: color .15s;
        }

        .back:hover {
            color: var(--ink)
        }

        .wheel {
            position: fixed;
            left: 50%;
            bottom: calc(16px + var(--safe-b));
            transform: translateX(-50%);
            z-index: 5;
            width: 64px;
            height: 64px;
            pointer-events: none;
            color: var(--muted);
            opacity: .85;
        }

        #wheel-rim {
            display: block;
            width: 100%;
            height: 100%;
            transition: transform .05s linear;
        }

        body.touch .wheel {
            bottom: calc(26px + var(--safe-b));
            width: 58px;
            height: 58px;
        }

        .controls {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 6;
            display: none;
            justify-content: space-between;
            align-items: center;
            padding: 8px 18px calc(8px + var(--safe-b));
            background: linear-gradient(to top, rgba(10, 13, 18, .94), rgba(10, 13, 18, .55));
            border-top: 1px solid var(--line);
        }

        body.touch {
            --ctor: 87px;
        }

        body.touch .controls {
            display: flex
        }

        .pad {
            display: flex;
            gap: 10px
        }

        .ctl {
            width: 70px;
            height: 70px;
            border-radius: 21px;
            background: rgba(255, 255, 255, .07);
            border: 1px solid rgba(255, 255, 255, .13);
            color: var(--ink);
            font-size: 19px;
            display: grid;
            place-items: center;
            cursor: pointer;
            touch-action: none;
            transition: background .08s, border-color .08s, transform .08s;
        }

        .ctl.on {
            background: rgba(95, 184, 255, .28);
            border-color: rgba(95, 184, 255, .55);
            transform: scale(.96);
        }

        .result {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: grid;
            place-items: center;
            padding: 24px;
            background: rgba(6, 9, 13, .55);
            backdrop-filter: blur(6px);
            opacity: 1;
            transition: opacity .2s;
        }

        .result.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .card {
            width: min(360px, 100%);
            padding: 26px;
            border-radius: 18px;
            background: #10161f;
            border: 1px solid var(--line);
            box-shadow: 0 24px 60px rgba(0, 0, 0, .6);
            text-align: center;
        }

        .card h2 {
            margin: 0 0 6px;
            font-size: 22px;
            letter-spacing: -.01em;
            color: var(--good);
        }

        .card p {
            margin: 0 0 20px;
            color: var(--muted);
            font-size: 13px;
        }

        .actions {
            display: flex;
            gap: 8px
        }

        .actions button {
            flex: 1;
            appearance: none;
            border: 0;
            font: inherit;
            font-size: 13px;
            font-weight: 550;
            padding: 11px 14px;
            border-radius: 10px;
            cursor: pointer;
            background: var(--accent);
            color: #05131f;
            transition: filter .15s;
        }

        .actions button:hover {
            filter: brightness(1.1)
        }

        .actions button.ghost {
            background: rgba(255, 255, 255, .07);
            color: var(--ink);
            border: 1px solid var(--line);
        }

        .actions button:disabled {
            opacity: .35;
            cursor: default;
            filter: none;
        }

        .rotate {
            position: fixed;
            inset: 0;
            z-index: 20;
            display: none;
            place-items: center;
            text-align: center;
            padding: 32px;
            background: var(--bg);
            color: var(--ink);
            font-size: 16px;
            font-weight: 550;
        }

        .rotate svg {
            display: block;
            margin: 0 auto 18px;
            opacity: .55;
        }

        .rotate small {
            display: block;
            margin-top: 8px;
            font-size: 12.5px;
            font-weight: 400;
            color: var(--muted);
        }

        body.touch .hud {
            height: auto;
            bottom: auto;
        }

        body.touch .row.bottom {
            display: none
        }

        body.touch .brand small {
            display: none
        }

        @media (orientation: portrait) and (max-width: 620px) {
            body.touch .rotate {
                display: grid
            }
        }

        @media (max-width: 760px) {
            .hint {
                display: none
            }

            .brand small {
                display: none
            }
        }
    </style>
</head>

<body>
    <div id="stage"><canvas id="game"></canvas></div>

    <div class="wheel" aria-hidden="true">
        <svg id="wheel-rim" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="4.5"
            stroke-linecap="round">
            <circle cx="32" cy="32" r="26" />
            <path d="M6.5 32h51" />
            <path d="M32 32v26" />
            <circle cx="32" cy="32" r="5.5" fill="currentColor" stroke="none" />
        </svg>
    </div>

    <div class="hud">
        <div class="row">
            <div class="brand">
                Parallel Parking
                <small>Reverse into the gap and stop inside the lines.</small>
            </div>
            <div class="levels">
                <button data-level="easy">Easy</button>
                <button data-level="normal">Normal</button>
                <button data-level="hard">Hard</button>
            </div>
            <div class="stats">
                <div class="stat"><span>Hits</span><b id="hits">0</b></div>
                <div class="stat"><span>Time</span><b id="time">0.0s</b></div>
                <div class="stat"><span>Gear</span><b id="gear" data-gear="N">N</b></div>
            </div>
        </div>

        <div class="row bottom">
            <div class="hint">
                <kbd>W</kbd><kbd>S</kbd> drive
                <span class="dot">·</span>
                <kbd>A</kbd><kbd>D</kbd> steer
                <span class="dot">·</span>
                <kbd>Space</kbd> brake
                <span class="dot">·</span>
                <kbd>R</kbd> reset
            </div>
            <a class="back" href="sahinh.html">11 bài sa hình →</a>
            <a class="back" href="../">← Home</a>
        </div>
    </div>

    <div class="controls">
        <div class="pad">
            <button class="ctl" data-key="ArrowDown" aria-label="Reverse">▼</button>
            <button class="ctl" data-key="ArrowUp" aria-label="Drive forward">▲</button>
        </div>
        <div class="pad">
            <button class="ctl" data-key="ArrowLeft" aria-label="Steer left">◀</button>
            <button class="ctl" data-key="ArrowRight" aria-label="Steer right">▶</button>
        </div>
    </div>

    <div class="rotate">
        <div>
            <svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
                stroke-linecap="round" stroke-linejoin="round">
                <rect x="6" y="2" width="12" height="20" rx="2.5" />
                <path d="M2 8a10 10 0 0 1 3-5" />
                <path d="M2 3.5V8h4.5" />
            </svg>
            Rotate your device
            <small>The car park needs a landscape screen.</small>
        </div>
    </div>

    <div class="result hidden" id="result">
        <div class="card">
            <h2 id="result-title">Parked</h2>
            <p id="result-sub"></p>
            <div class="actions">
                <button id="retry">Try again</button>
                <button id="next" class="ghost">Next level</button>
            </div>
        </div>
    </div>

    <script src="parking.js"></script>
</body>

</html>
